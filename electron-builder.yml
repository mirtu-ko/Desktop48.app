appId: com.electron.desktop48
productName: Desktop48
directories:
  buildResources: build
files:
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,.nvmrc}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.web.tsbuildinfo,vitest.config.ts}'
  - '!{test,docs,.vitest}/**'
  - '!**/.vitest-run.log'
  # 本地脚手架 + AI 编码工具目录。
  - '!**/{.tmp,.preview-shot,.workbuddy*,.trae,.github,.claude,.cursor,.continue,.codex,.gemini,.windsurf,.clinerules,.roo,.kilocode,.specstory,.vscode}/**'
  # 文件级：MCP 配置里常带第三方 token；aider 会留 .aider.conf.yml / .aider.chat.history.md 等。
  - '!**/{.mcp.json,.aider*}'
asarUnpack:
  - resources/**
electronLanguages:
  - zh-CN
  - en-US
  # ⚠ macOS 必须额外写 zh_CN：win/linux 的 locale 是 locales/zh-CN.pak（连字符），
  - zh_CN
# 压缩档位仅影响安装包体积与构建耗时，不影响运行时。
compression: maximum
# 熔断高危能力：禁 runAsNode / inspect 注入，校验 asar 完整性并只从 asar 加载应用。
# 需 overrides 把 @electron/fuses 锁 ^2.1.3：1.8.0 用 includes('.app') 判 macOS 包，
# 会把本仓库目录名 desktop48.app 误判成 macOS 路径，致 Windows/Linux 构建报 ENOENT；2.x 已修复。
electronFuses:
  runAsNode: false
  enableNodeCliInspectArguments: false
  enableNodeOptionsEnvironmentVariable: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  executableName: Desktop48
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  # 双架构：CI runner 均为 arm64，不写 arch 出不了 Intel 包；产物名须带 ${arch} 防撞名。
  # 只出 dmg：zip 仅供 Squirrel.Mac 自动更新，本项目未用 electron-updater；接入时需加回。
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  extendInfo:
    # 只声明实际触发的权限（目录选择），全仓无摄像头/麦克风调用。
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  # ${arch} 防止 x64/arm64 产物撞同名。
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: mirtu-ko
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: github
  owner: mirtu-ko
  repo: Desktop48.app
  releaseType: release # 与 CI 预创建的正式 release 匹配，否则 electron-builder 默认发 draft，类型不兼容会跳过上传
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
