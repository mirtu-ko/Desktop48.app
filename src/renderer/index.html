<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Desktop48</title>
    <!-- 参考：https://developer.mozilla.org/zh-CN/docs/Web/HTTP/CSP -->
    <!--
      真实生效的 CSP（此前是空的 http-equiv，等于没有策略）。
      口径说明：
      - script：只允许自身与 Umami 埋点脚本；不放开 unsafe-eval（渲染层无 eval / wasm）
      - style：'unsafe-inline' 是 Vue scoped 样式与 Element Plus 运行时注入样式所必需
      - img/media/connect：CDN 与直播中转地址由接口下发、无法枚举，http / https 都有
        （见 main/allowed-hosts.ts）；页面走 file://，不受混合内容限制，只放 https: 会被
        CSP 静默拦掉（裂图 / 黑屏）。本地 HTTP-FLV 中转也落在 http: 之内。
      - worker：hls.js / mpegts.js 的分片转封装走 blob worker
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
        script-src 'self' https://cloud.umami.is;
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob: https: http:;
        media-src 'self' blob: https: http:;
        font-src 'self' data:;
        connect-src 'self' https: http: ws: wss:;
        worker-src 'self' blob:;
        frame-src 'none';
        object-src 'none';
        base-uri 'self';
        form-action 'none'"
    />
    <!-- 关闭自动采集（data-auto-track），改由 utils/umami.ts 的 trackPage 上报清洗后的 hash 路由 -->
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="6a5198f5-45be-4ce8-a2f9-6503322ed838"
      data-auto-track="false"
    ></script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
