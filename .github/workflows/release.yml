name: Build & Release

on:
  push:
    tags:
      - 'v*' # v 开头的 tag 触发，三端全量发布
  # 手动触发：单独补发某个平台，或从一个还没打 tag 的 commit 首发。
  # tag 必须走输入而不是 GITHUB_REF_NAME —— GitHub 的「Use workflow from」下拉框只列分支、
  # 选不到 tag，直接依赖它就会拿到 main，进而创建出一个叫 main 的 release。
  # 输入留空时按 package.json 的版本补，这样「发当前 main 的版本」不用手打 tag。
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的 tag（如 v0.2.16）。留空则取 package.json 的版本；该 tag 不存在时从当前 commit 创建
        required: false
        default: ''
        type: string
      # 重发已有版本的修复包时用：tag 决定发到哪个 release，ref 决定用哪份代码构建。
      # 留空则用 tag 本身。注意产物会与 tag 指向的源码不一致——这是「同版本号重发」的固有代价，
      # 只在修 bug 补包时用，正常发版不要填。
      ref:
        description: 构建源（分支或 commit SHA）。留空则用 tag 本身
        required: false
        default: ''
        type: string
      linux:
        description: 构建 Linux（ubuntu-latest）
        type: boolean
        default: true
      windows:
        description: 构建 Windows（windows-latest）
        type: boolean
        default: false
      macos:
        description: 构建 macOS（macos-latest）
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # 把「发哪个 tag、跑哪些 runner」收敛到一处，后面的 job 只读它的输出。
  # 平台过滤必须在这里做（拼 matrix 数组），不能写成 release job 上的 `if: matrix.os == ...`：
  # job 级 if 在 matrix 展开之前求值，`matrix` 不在其可用上下文里，会直接报
  # `Unrecognized named-value: 'matrix'` —— 而且那是编译期错误，连 push 全量发版都会一起挂。
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      buildref: ${{ steps.resolve.outputs.buildref }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Resolve tag and platform matrix
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_REF: ${{ inputs.ref }}
          INPUT_LINUX: ${{ inputs.linux }}
          INPUT_WINDOWS: ${{ inputs.windows }}
          INPUT_MACOS: ${{ inputs.macos }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "push" ]; then
            tag="$REF_NAME"
            buildref="$REF_NAME"
            matrix='["ubuntu-latest","windows-latest","macos-latest"]'
          else
            tag="$INPUT_TAG"
            # 留空就按 package.json 的版本推出来：描述里承诺了这个行为，否则空值会走下面的
            # 格式校验直接报错，等于逼人背版本号。
            if [ -z "$tag" ]; then
              tag="v$(jq -r .version package.json)"
              echo "未指定 tag，按 package.json 取 ${tag}"
            fi

            case "$tag" in
              v[0-9]*) ;;
              *) echo "::error::tag 必须以 v 开头，收到「${tag}」"; exit 1 ;;
            esac

            # ref 是「重发已有版本」专用的：构建源与发布目标分开，tag 不必移动。
            # 首发不应填它（那种情况构建源就该等于 tag）。
            #
            # 必须解析成完整 40 位 SHA 再交出去：actions/checkout 只认分支名、完整 tag 或
            # 完整 SHA，短 SHA 会被当成分支名去 fetch `refs/heads/c98d126`，直接失败。
            # 走 API 解析的另一个好处是分支名会在这一刻钉死，不会随 ref 前进而漂移。
            buildref="$tag"
            if [ -n "$INPUT_REF" ]; then
              buildref="$(gh api "repos/$REPO/commits/$INPUT_REF" -q .sha 2>/dev/null)" || {
                echo "::error::解析不到 ref=$INPUT_REF：分支名、tag 或 commit SHA 都可以"
                exit 1
              }
              echo "ref $INPUT_REF → $buildref"
            fi

            # 补发已有 tag 时直接复用；tag 还没有就从当前 commit 创建，免得「想单平台首发」
            # 被逼着先 push tag —— 那会立刻触发三端全量构建。
            # 用 GITHUB_TOKEN 推的 tag 不会再触发本 workflow，这是能这么做的前提。
            if ! gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              if [ -n "$INPUT_REF" ]; then
                echo "::error::tag $tag 不存在：ref 只用于重发已有版本，首发请不要填 ref"
                exit 1
              fi
              version="$(jq -r .version package.json)"
              if [ "$tag" != "v$version" ]; then
                echo "::error::tag $tag 不存在，且与 package.json 的版本 v$version 不一致：先 bump 版本再触发，或推送正确的 tag"
                exit 1
              fi
              git tag "$tag"
              git push origin "refs/tags/$tag"
              echo "已创建并推送 tag $tag"
            fi

            os=""
            if [ "$INPUT_LINUX" = "true" ]; then os="$os\"ubuntu-latest\","; fi
            if [ "$INPUT_WINDOWS" = "true" ]; then os="$os\"windows-latest\","; fi
            if [ "$INPUT_MACOS" = "true" ]; then os="$os\"macos-latest\","; fi
            matrix="[${os%,}]"

            if [ "$matrix" = "[]" ]; then
              echo "::error::至少要勾选一个平台"
              exit 1
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "buildref=$buildref" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "tag=$tag  构建源=$buildref  平台=$matrix"

  # 先创建 release，避免 matrix 并行 job 各自创建导致重复 release（竞态）
  create-release:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        # tag 含 "-" 即 semver 预发行：必须加 --prerelease，否则 /releases/latest 会指向 beta
        # release 已存在时跳过创建，支持失败重跑、单平台补发与复用已有 release
        run: |
          args=(--title "$TAG" --generate-notes)
          case "$TAG" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" "${args[@]}"

  release:
    needs: [plan, create-release] # 等待 release 创建完成，后续 job 只上传产物
    runs-on: ${{ matrix.os }}

    strategy:
      # 一个平台失败不该取消其它平台：补发场景下重跑整个矩阵代价很高
      fail-fast: false
      matrix:
        # push tag 时是三个 runner；手动触发时由 plan 按勾选结果拼出来
        os: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Check out git repository
        uses: actions/checkout@v7
        with:
          # 构建源与发布目标分开：默认就是 tag 自己；重发修复包时由 plan 换成 main/commit。
          # create-release 仍按 tag 检出（它只用 tag 名，不参与构建）。
          ref: ${{ needs.plan.outputs.buildref }}

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          # 必须是 22.12+：electron@44 的 engines 下限是 >=22.12.0，vitest@5 更是直接排除了 Node 20。
          # 24 = 当前 Active LTS（安全支持到 2028-04），与 Electron 44 内置的 Node 运行时同线。
          # 改这里之前先看 .nvmrc 和 package.json 的 engines，三者要保持一致。
          node-version: 24
          cache: npm # 缓存 npm 下载目录（不含 node_modules），key 由 package-lock.json 的 hash 决定

      - name: Install Dependencies
        run: npm ci

      # 构建并发布
      # electron-builder 只构建当前 runner 的平台，所以单平台触发时 release 里就只有该平台产物；
      # 其余平台的 latest*.yml 不会被覆盖，自动更新链路不受影响。
      # 这里的 GH_TOKEN 是 GitHub 自动生成的，无需手动设置
      - name: Build and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 同版本重发要覆盖已发布的 release，但 electron-publish 默认拒绝：找到的 release
          # 发布超过 2 小时就 return null，之后每个文件只打一行 warn 跳过，**退出码仍是 0**。
          # 判据是 release 的 published_at，与资产是否已存在无关，所以删资产重跑也解不开。
          # 关掉这个时间闸门后，同名资产会走它自带的「先删后传」分支。
          EP_GH_IGNORE_TIME: 'true'
        run: npm run release

      # 上面那种「绿的但什么都没传」只有翻构建日志才看得出来，这里按实际产物核对一遍。
      # 只跑 Linux：其它 runner 的 stat/dist 命名都不一样，而重发场景本来就只用 Linux。
      - name: Verify release assets
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -uo pipefail
          assets="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" -q '.assets[] | "\(.name)\t\(.size)"')" || {
            echo "::error::读不到 release $TAG 的资产列表"
            exit 1
          }
          fail=0
          for file in dist/*.AppImage dist/*.deb dist/latest*.yml; do
            [ -e "$file" ] || continue
            name="$(basename "$file")"
            local_size="$(stat -c%s "$file")"
            remote_size="$(printf '%s\n' "$assets" | awk -F'\t' -v n="$name" '$1 == n { print $2 }')"
            if [ -z "$remote_size" ]; then
              echo "::error::${name} 不在 release $TAG 上：上传被跳过或失败"
              fail=1
            elif [ "$remote_size" != "$local_size" ]; then
              echo "::error::${name} 尺寸对不上（GitHub ${remote_size} / 本地 ${local_size}）：覆盖没有生效"
              fail=1
            else
              echo "OK  ${name}  ${local_size}"
            fi
          done
          exit "$fail"
